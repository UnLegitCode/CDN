<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${metadata.displayName}">Просмотр видео</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link href="/styles/video.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
            <i class="fa-solid fa-play text-danger me-2"></i>
            MaxTube
        </a>

        <div class="d-flex flex-grow-1 justify-content-center mx-4" style="max-width: 600px;">
            <div class="input-group">
                <input type="text" class="form-control bg-dark text-light border-secondary"
                       placeholder="Поиск видео...">
                <button class="btn btn-outline-secondary"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>

        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-outline-light"><i class="fa-solid fa-video"></i></button>
            <button class="btn btn-outline-light"><i class="fa-solid fa-bell"></i></button>
            <div class="rounded-circle bg-secondary overflow-hidden" style="width: 32px; height: 32px;">
                <img src="https://via.placeholder.com/32" alt="User" class="w-100 h-100 object-fit-cover">
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row gx-4">
        <div class="col-lg-8">
            <div class="video-container mb-4">
                <video id="mainVideo" controls autoplay playsinline class="w-100">
                    <source th:src="${videoUrl}" type="video/mp4">
                    Ваш браузер не поддерживает воспроизведение видео.
                </video>
            </div>

            <div class="metadata mb-4">
                <h1 class="title mb-3" th:text="${metadata.displayName}">Название видео</h1>
            </div>
        </div>

        <div class="metadata mb-4">
            <div class="d-flex justify-content-between mb-3">
                <span class="fw-bold">123 456 просмотров • 2 дня назад</span>
            </div>
            <div class="text-light-emphasis" style="white-space: pre-wrap;">
                Здесь будет описание видео. Можно добавить поддержку разметки или просто текст.
                <br><br>
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et
                dolore magna aliqua.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/scripts/video.js"></script>
</body>
</html>
