<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link href="/styles/video_list.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
            <i class="fa-solid fa-play text-danger me-2"></i>
            MaxTube
        </a>
    </div>
</nav>

<div class="container-fluid mt-4 pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4 px-2">
        <h4 class="mb-0" th:text="${param.search != null} ? 'Результаты поиска' : 'Все видео'">
            Все видео
        </h4>
        <span class="text-muted" th:if="${videos != null}" th:text="${videos.size()} + ' видео'"></span>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4"
         th:if="${videos != null and !videos.isEmpty()}">
        <div class="col" th:each="video : ${videos}">
            <a th:href="@{/video/{id}(id=${video.id()})}" class="text-decoration-none text-light">
                <div class="video-card h-100">

                    <!-- Превью -->
                    <div class="thumbnail-container">
                        <img th:src="${video.previewUrl()}"
                             class="thumbnail"
                             alt="Превью"
                             onerror="this.src='https://via.placeholder.com/320x180/1a1a1a/666?text=No+Preview'">
                    </div>

                    <!-- Информация -->
                    <div class="card-body">
                        <h6 class="video-title fw-medium mb-2" th:text="${video.displayName()}">
                            Название видео которое может быть достаточно длинным
                        </h6>
                    </div>
                </div>
            </a>
        </div>

        <div class="text-center py-5">
            <i class="fa-solid fa-film fa-4x text-muted mb-4"></i>
            <a href="/video/upload" class="btn btn-danger mt-3">Загрузить видео</a>
        </div>
    </div>

    <div class="text-center py-5" th:if="${videos == null or videos.isEmpty()}">
        <i class="fa-solid fa-film fa-4x text-muted mb-4"></i>
        <h5 th:if="${param.search != null}">По запросу «<span th:text="${param.search}"></span>» ничего не найдено</h5>
        <h5 th:if="${param.search == null}">Видео пока нет</h5>
        <p class="text-muted">Попробуйте изменить поисковый запрос или загрузить новое видео</p>
        <a href="/video/upload" class="btn btn-danger mt-3">Загрузить видео</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
