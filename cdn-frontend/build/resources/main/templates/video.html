<!DOCTYPE html>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-card: #1a1a1a;
        }

        body {
            background-color: var(--bg-dark);
            color: #efefef;
            font-family: 'Roboto', system-ui, sans-serif;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        video {
            width: 100%;
            height: auto;
            max-height: 75vh;
            background: #000;
        }

        .metadata {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .sidebar {
            background-color: var(--bg-card);
            border-radius: 12px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .recommended-card {
            transition: all 0.2s;
        }

        .recommended-card:hover {
            transform: translateY(-3px);
            background-color: #252525;
        }

        .thumbnail {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
        }
    </style>
</head>

<script>
    // Автоматическое воспроизведение с muted (для политики браузеров)
    document.addEventListener('DOMContentLoaded', () => {
        const video = document.getElementById('mainVideo');

        // Пытаемся включить звук после первого взаимодействия пользователя
        video.addEventListener('play', () => {
            if (video.muted) video.muted = false;
        }, { once: true });
    });
</script>
