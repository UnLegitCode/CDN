<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка видео</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-card: #1a1a1a;
        }

        body {
            background-color: var(--bg-dark);
            color: #efefef;
        }

        .upload-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            max-width: 720px;
            margin: 2rem auto;
        }

        .form-control, .form-select {
            background-color: #252525;
            border: 1px solid #444;
            color: white;
        }

        .form-control:focus {
            background-color: #2a2a2a;
            border-color: #e50914;
            box-shadow: 0 0 0 0.2rem rgba(229, 9, 20, 0.25);
            color: white;
        }

        .file-drop-zone {
            border: 2px dashed #555;
            border-radius: 12px;
            padding: 2.5rem 1rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-drop-zone:hover,
        .file-drop-zone.dragover {
            border-color: #e50914;
            background-color: #1f1f1f;
        }

        .preview-img {
            max-height: 180px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .btn-upload {
            background-color: #e50914;
            border: none;
            font-weight: 600;
            padding: 12px 40px;
        }

        .btn-upload:hover {
            background-color: #f40612;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
            <i class="fa-solid fa-play text-danger me-2"></i>
            MaxTube
        </a>

        <div class="d-flex align-items-center gap-3">
            <a href="/videos" class="btn btn-outline-light">Все видео</a>
            <div class="rounded-circle bg-secondary overflow-hidden" style="width: 32px; height: 32px;">
                <img src="https://via.placeholder.com/32" alt="User" class="w-100 h-100 object-fit-cover">
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="upload-card p-5 mt-5">
        <div class="text-center mb-5">
            <i class="fa-solid fa-cloud-upload-alt fa-3x text-danger mb-3"></i>
            <h3 class="fw-bold">Загрузка нового видео</h3>
            <p class="text-muted">Заполните информацию и загрузите файлы</p>
        </div>

        <form th:action="@{/video/upload}" method="post" enctype="multipart/form-data" id="uploadForm">
            <!-- Название видео -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Название видео <span class="text-danger">*</span></label>
                <input type="text"
                       name="title"
                       id="titleInput"
                       class="form-control form-control-lg"
                       placeholder="Введите название видео"
                       maxlength="64"
                       required>
                <div class="text-end text-muted small mt-1">
                    <span id="charCount">0</span>/64
                </div>
            </div>

            <!-- Превью -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Превью (обложка)</label>
                <div class="file-drop-zone" id="previewDropZone">
                    <input type="file"
                           name="previewFile"
                           id="previewFile"
                           accept="image/jpeg,image/png,image/webp"
                           class="d-none" required>

                    <div id="previewPlaceholder">
                        <i class="fa-solid fa-image fa-2x text-muted mb-3"></i>
                        <p class="mb-1 fw-medium">Нажмите или перетащите изображение</p>
                        <small class="text-muted">Рекомендуемый размер: 1280×720 (16:9)</small>
                    </div>

                    <div id="previewPreview" class="d-none">
                        <img id="previewImage" class="preview-img mb-3" alt="Превью">
                        <p class="small text-success mb-0">
                            <i class="fa-solid fa-check"></i> Превью выбрано
                        </p>
                    </div>
                </div>
            </div>

            <!-- Видео файл -->
            <div class="mb-5">
                <label class="form-label fw-semibold">Видео файл <span class="text-danger">*</span></label>
                <div class="file-drop-zone" id="videoDropZone">
                    <input type="file"
                           name="videoFile"
                           id="videoFile"
                           accept="video/mp4,video/webm"
                           class="d-none" required>

                    <div id="videoPlaceholder">
                        <i class="fa-solid fa-film fa-2x text-muted mb-3"></i>
                        <p class="mb-1 fw-medium">Нажмите или перетащите видео</p>
                        <small class="text-muted">MP4 или WebM • Максимум 2 ГБ</small>
                    </div>

                    <div id="videoSelected" class="d-none text-center">
                        <i class="fa-solid fa-check-circle fa-2x text-success mb-2"></i>
                        <p id="videoFileName" class="mb-0 fw-medium text-light"></p>
                    </div>
                </div>
            </div>

            <!-- Кнопки -->
            <div class="d-flex justify-content-between align-items-center">
                <a href="/videos" class="btn btn-outline-secondary px-4">Отмена</a>
                <button type="submit" id="submitBtn" class="btn btn-danger btn-upload">
                    <i class="fa-solid fa-upload me-2"></i>
                    Загрузить видео
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Подсчёт символов в названии
    const titleInput = document.getElementById('titleInput');
    const charCount = document.getElementById('charCount');

    titleInput.addEventListener('input', () => {
        charCount.textContent = titleInput.value.length;
    });

    // Превью изображения
    const previewFileInput = document.getElementById('previewFile');
    const previewDropZone = document.getElementById('previewDropZone');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const previewPreview = document.getElementById('previewPreview');
    const previewImage = document.getElementById('previewImage');

    function handlePreviewFile(file) {
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImage.src = e.target.result;
                previewPlaceholder.classList.add('d-none');
                previewPreview.classList.remove('d-none');
            }
            reader.readAsDataURL(file);
        }
    }

    previewDropZone.addEventListener('click', () => previewFileInput.click());

    previewFileInput.addEventListener('change', (e) => {
        handlePreviewFile(e.target.files[0]);
    });

    // Drag & Drop для превью
    previewDropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        previewDropZone.classList.add('dragover');
    });

    previewDropZone.addEventListener('dragleave', () => {
        previewDropZone.classList.remove('dragover');
    });

    previewDropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        previewDropZone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            previewFileInput.files = e.dataTransfer.files;
            handlePreviewFile(file);
        }
    });

    // Видео файл
    const videoFileInput = document.getElementById('videoFile');
    const videoDropZone = document.getElementById('videoDropZone');
    const videoPlaceholder = document.getElementById('videoPlaceholder');
    const videoSelected = document.getElementById('videoSelected');
    const videoFileName = document.getElementById('videoFileName');

    videoDropZone.addEventListener('click', () => videoFileInput.click());

    videoFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            videoPlaceholder.classList.add('d-none');
            videoSelected.classList.remove('d-none');
            videoFileName.textContent = file.name;
        }
    });

    // Drag & Drop для видео
    videoDropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        videoDropZone.classList.add('dragover');
    });

    videoDropZone.addEventListener('dragleave', () => videoDropZone.classList.remove('dragover'));

    videoDropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        videoDropZone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('video/')) {
            videoFileInput.files = e.dataTransfer.files;
            videoPlaceholder.classList.add('d-none');
            videoSelected.classList.remove('d-none');
            videoFileName.textContent = file.name;
        }
    });

    // Предотвращение отправки пустой формы
    document.getElementById('uploadForm').addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Загрузка...`;
    });
</script>
</body>
</html>
