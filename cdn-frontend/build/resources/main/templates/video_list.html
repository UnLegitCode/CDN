<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-card: #1a1a1a;
        }

        body {
            background-color: var(--bg-dark);
            color: #efefef;
        }

        .video-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .thumbnail-container {
            position: relative;
        }

        .thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        .card-body {
            padding: 12px 14px;
        }

        .video-title {
            font-size: 1.05rem;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.7em;
        }

        .channel {
            color: #aaaaaa;
            font-size: 0.95rem;
        }

        .meta {
            color: #888;
            font-size: 0.9rem;
        }

        .search-input {
            background-color: #1f1f1f;
            border: 1px solid #444;
            color: white;
        }

        .search-input:focus {
            background-color: #292929;
            border-color: #666;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
        }
    </style>
</head>

<div class="container-fluid mt-4 pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4 px-2">
        <h4 class="mb-0" th:text="${param.search != null} ? 'Результаты поиска' : 'Все видео'">
            Все видео
        </h4>
        <span class="text-muted" th:if="${videos != null}" th:text="${videos.size()} + ' видео'"></span>
    </div>

    <!-- Сетка видео -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4" th:if="${videos != null and !videos.isEmpty()}">

        <div class="col" th:each="video : ${videos}">
            <a th:href="@{/video/{id}(id=${video.id()})}" class="text-decoration-none text-light">
                <div class="video-card h-100">

                    <!-- Превью -->
                    <div class="thumbnail-container">
                        <img th:src="${video.previewUrl()}"
                             class="thumbnail"
                             alt="Превью"
                             onerror="this.src='https://via.placeholder.com/320x180/1a1a1a/666?text=No+Preview'">
                    </div>

                    <!-- Информация -->
                    <div class="card-body">
                        <h6 class="video-title fw-medium mb-2" th:text="${video.displayName()}">
                            Название видео которое может быть достаточно длинным
                        </h6>
                    </div>
                </div>
            </a>
        </div>

        <div class="text-center py-5">
            <i class="fa-solid fa-film fa-4x text-muted mb-4"></i>
            <a href="/video/upload" class="btn btn-danger mt-3">Загрузить видео</a>
        </div>
    </div>

    <!-- Пустое состояние -->
    <div class="text-center py-5" th:if="${videos == null or videos.isEmpty()}">
        <i class="fa-solid fa-film fa-4x text-muted mb-4"></i>
        <h5 th:if="${param.search != null}">По запросу «<span th:text="${param.search}"></span>» ничего не найдено</h5>
        <h5 th:if="${param.search == null}">Видео пока нет</h5>
        <p class="text-muted">Попробуйте изменить поисковый запрос или загрузить новое видео</p>
        <a href="/video/upload" class="btn btn-danger mt-3">Загрузить видео</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
